name: Auto Check Alive Nodes

on:
  schedule:
    - cron: "*/30 * * * *" # 每 30 分钟自动测活一次
  workflow_dispatch:       # 支持在网页端手动点按钮立刻跑一次

permissions:
  contents: write

jobs:
  check-nodes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Download Mihomo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import json, os, re, urllib.request
          req = urllib.request.Request(
              "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "User-Agent": "gh-action"}
          )
          data = json.loads(urllib.request.urlopen(req, timeout=20).read().decode())
          assets = [a["browser_download_url"] for a in data.get("assets", [])]
          pick = next((u for u in assets if re.search(r"mihomo-linux-amd64-compatible-v[\d.]+\.gz$", u)), None) \
              or next((u for u in assets if re.search(r"mihomo-linux-amd64-v[\d.]+\.gz$", u)), None)
          if not pick:
              raise RuntimeError(f"No matching mihomo asset: {assets[:10]}")
          print("Downloading:", pick)
          urllib.request.urlretrieve(pick, "mihomo.gz")
          EOF
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Run YouTube 204 health check
        env:
          TEAM_SUB_URL: ${{ secrets.TEAM_SUB_URL }}
        run: python scripts/check_alive.py

      - name: Publish alive.txt to alive-sub branch
        run: |
          cd alive_out
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alive.txt stats.json
          git commit -m "Update alive nodes"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/alive-sub
