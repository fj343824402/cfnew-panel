name: Auto Check Alive Nodes

on:
  schedule:
    - cron: "*/30 * * * *" # 每 30 分钟自动测活一次
  workflow_dispatch:       # 支持在网页端手动点按钮立刻跑一次

permissions:
  contents: write

jobs:
  check-nodes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Download Mihomo
        run: |
          URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | grep -oE 'https://[^"]+mihomo-linux-amd64-compatible-v[0-9.]+\.gz' | head -n 1)
          if [ -z "$URL" ]; then
            URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
              | grep -oE 'https://[^"]+mihomo-linux-amd64-v[0-9.]+\.gz' | head -n 1)
          fi
          curl -L "$URL" -o mihomo.gz
          gunzip -f mihomo.gz
          chmod +x mihomo

      - name: Run YouTube 204 health check
        env:
          TEAM_SUB_URL: ${{ secrets.TEAM_SUB_URL }}
        run: python scripts/check_alive.py

      - name: Publish alive.txt to alive-sub branch
        run: |
          cd alive_out
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alive.txt stats.json
          git commit -m "Update alive nodes"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/alive-sub
